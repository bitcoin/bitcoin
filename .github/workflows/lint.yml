name: Lint

on:
  workflow_call:
    inputs:
      container-path:
        description: "Path to built container at registry"
        required: true
        type: string
      runs-on:
        description: "Runner label to use"
        required: true
        type: string

jobs:
  lint:
    name: Run linters
    runs-on: ${{ inputs.runs-on }}
    container:
      image: ${{ inputs.container-path }}
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          fetch-depth: 50

      - name: Initial setup
        run: |
          git config --global --add safe.directory "$PWD"
          git fetch --no-tags -fu origin develop:develop
          mkdir -p /cache/cppcheck
        shell: bash

      - name: Restore cppcheck cache
        uses: actions/cache/restore@v5
        with:
          path: /cache/cppcheck
          key: cppcheck-${{ hashFiles('contrib/containers/ci/ci-slim.Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            cppcheck-${{ hashFiles('contrib/containers/ci/ci-slim.Dockerfile') }}-

      - name: Run linters
        run: |
          export CACHE_DIR="/cache"
          export BUILD_TARGET="linux64"
          export CHECK_DOC=1

          # Determine if this is a PR and set commit range accordingly
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            export COMMIT_RANGE="$(git merge-base origin/develop HEAD)..HEAD"
            export PULL_REQUEST="true"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/develop" ] && [ "${{ github.ref }}" != "refs/heads/master" ]; then
            # For push events on feature branches, check against develop
            export COMMIT_RANGE="$(git merge-base origin/develop HEAD)..HEAD"
            export PULL_REQUEST="true"
          else
            # For pushes to develop/master or other events
            export COMMIT_RANGE="HEAD~..HEAD"
            export PULL_REQUEST="false"
          fi

          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "COMMIT_RANGE=${COMMIT_RANGE}"
          echo "PULL_REQUEST=${PULL_REQUEST}"
          echo "Running git log for commit range:"
          git log --oneline ${COMMIT_RANGE} || echo "Could not show commit range"

          ./ci/dash/lint.sh
          test/lint/cppcheck-dash.py
          du -sh "${CACHE_DIR}/cppcheck"
        shell: bash

      - name: Save cppcheck cache
        if: |
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@v5
        with:
          path: /cache/cppcheck
          key: cppcheck-${{ hashFiles('contrib/containers/ci/ci-slim.Dockerfile') }}-${{ github.sha }}
